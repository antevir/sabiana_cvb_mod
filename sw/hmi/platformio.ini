[platformio]
src_dir = src
default_envs = hmi

[env]
platform = espressif32@6.5.0
framework = arduino
board = esp32dev
monitor_speed = 115200

lib_deps =
  lvgl/lvgl@^9.1.0
  bodmer/TFT_eSPI@^2.5.34
  PaulStoffregen/OneWire @ ^2.3.7
  robtillaart/DS18B20@^0.2.4
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
  makerspaceleiden/TLog@1.0.5
  knolleary/PubSubClient@2.8

build_flags =
  -Icfg/
  -I../src_common
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_USE_DEMO_WIDGETS
  -DLV_USE_TFT_ESPI
	-DUSER_SETUP_LOADED
	-DUSE_HSPI_PORT
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000

board_build.filesystem = littlefs

build_src_filter =
  +<*>
  -<.git/>
  -<.svn/>

[env:hmi]
build_flags =
  ${env.build_flags}
	-DILI9341_2_DRIVER
